# Приложение (api + frontend).
# Инфра отдельно:
#   docker compose --env-file backend/.env -f docker-compose.mongo.yaml up -d
#   docker compose --env-file backend/.env -f docker-compose.redis.yaml up -d
#   docker compose --env-file backend/.env -f docker-compose.s3.yaml up -d
#   docker compose --env-file backend/.env up -d
#
# Сеть: overtone-network (общая с mongo/redis/minio/GPU service).

# Сохраняет имена контейнеров и volumes после переноса Compose из backend/.
name: backend

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    restart: unless-stopped
    env_file: backend/.env
    ports:
      - '3000:3000'
    volumes:
      - recordings_data:/app/recordings
    mem_limit: 384m
    cpus: 0.4
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - overtone-network

  frontend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    mem_limit: 64m
    cpus: 0.1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - overtone-network

networks:
  overtone-network:
    name: overtone-network

volumes:
  recordings_data:
