# GPU inference service from the sibling medical-scribe repository.
# MinIO and overtone-network must be started by Overtone first.

name: backend

services:
  inference:
    build:
      context: ../medical-scribe
      dockerfile: Dockerfile.gpu
    restart: unless-stopped
    env_file: ../medical-scribe/.env
    environment:
      MEDSCRIBE_EXECUTION_MODE: gpu
      MEDSCRIBE_S3_ENDPOINT: http://minio:9000
      MEDSCRIBE_S3_BUCKET: ${S3_BUCKET:-medical-scribe}
      MEDSCRIBE_S3_REGION: ${S3_REGION:-us-east-1}
      MEDSCRIBE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      MEDSCRIBE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '127.0.0.1:50051:50051'
    networks:
      - overtone-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  overtone-network:
    external: true
    name: overtone-network
