name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push backend image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/overtone-backend:latest
          docker build -t $IMAGE_NAME --target backend .
          docker push $IMAGE_NAME

      - name: Build and push frontend image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/overtone-frontend:latest
          docker build -t $IMAGE_NAME --target frontend .
          docker push $IMAGE_NAME

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Restart Docker Compose on server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            cd /home/deployer/app/overtone
            docker compose pull
            docker compose up -d
            docker system prune -af
