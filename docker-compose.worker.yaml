name: backend
services:
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    command: ['node', 'dist/worker/main.js']
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: backend/.env
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://overtone:overtone_local@postgres:5432/overtone}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      INFERENCE_GRPC_ADDRESS: inference:50051
    networks:
      - overtone-network
networks:
  overtone-network:
    name: overtone-network
